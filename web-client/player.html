<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>互动阅读 · StoryPal</title><link rel="stylesheet" href="/static/styles.css"></head>
<body class="player-page"><div class="shell player-nav"><a class="brand" href="/"><span class="brand-mark">S</span>StoryPal</a><span><i id="dot" class="status-dot"></i><span id="connection">连接中</span></span></div>
